name: Release

# Build the .vsix and attach it to a GitHub Release when a version tag is pushed.
#   git tag v0.0.1 && git push origin v0.0.1
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # required to create the release and upload the asset

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # fetch the annotated tag object so its message is available

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile
        run: pnpm run compile

      - name: Package VSIX
        id: package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          FILE="vscode-worktree-${VERSION}.vsix"
          pnpm exec vsce package --no-dependencies -o "$FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # actions/checkout fetches tags as lightweight refs, which drops the
          # annotation message. Re-fetch to restore the real annotated tag object.
          git fetch --force --tags origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"

          # Use the annotated tag's message body as the release notes. If the tag
          # is lightweight (or has an empty message), fall back to auto-generated
          # notes from the commit history. %(contents) on an annotated tag yields
          # its message; on a lightweight tag it derefs to the commit message, so
          # guard against that by reading the tag object's type first.
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" = "tag" ]; then
            NOTES="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")"
          else
            NOTES=""
          fi
          if [ -n "${NOTES//[[:space:]]/}" ]; then
            printf '%s\n' "$NOTES" > release-notes.md
            gh release create "$GITHUB_REF_NAME" \
              "${{ steps.package.outputs.file }}" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" \
              "${{ steps.package.outputs.file }}" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
